[package]
name = "dedupe2"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
seahash = "4"
rayon = "1"
nom-exif = "3.7"
rawler = "0.8"
chrono = "0.4"
image = "0.25"
heic = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3

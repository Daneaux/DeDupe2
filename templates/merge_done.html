<section class="panel">
  <div class="panel-toolbar">
    <div class="toolbar-title">
      <h2>Merge Complete</h2>
      <span class="subtitle">Consolidated your libraries</span>
    </div>
  </div>

  <div class="merge-summary">
    <div class="summary-stat">
      <span class="summary-value">{{ kept }}</span>
      <span class="summary-label">kept</span>
    </div>
    <div class="summary-stat">
      <span class="summary-value">{{ purged }}</span>
      <span class="summary-label">purged</span>
    </div>
  </div>

  <dl class="merge-paths">
    <dt>Destination</dt>
    <dd class="path">{{ destination }}</dd>
    <dt>Purgatory</dt>
    <dd class="path">{{ purgatory }}</dd>
  </dl>

  <div class="toolbar-actions">
    <a class="btn btn-primary" href="/merge">Merge another</a>
  </div>
</section>

{% extends "base.html" %}

{% block content %}
<section class="panel" role="tabpanel">
  <div class="panel-toolbar">
    <div class="toolbar-title">
      <h2>Compare Folders</h2>
      <span class="subtitle">Fast scan two trees and show duplicates and originals</span>
    </div>
  </div>

  <form method="post" action="/compare/run" id="compare-form">
    <label class="field">
      <span>Destination tree (A)</span>
      <input type="text" name="a" placeholder="/path/to/library" />
      <span class="hint">The originals you already have.</span>
    </label>

    <label class="field">
      <span>Candidate tree (B)</span>
      <input type="text" name="b" placeholder="/path/to/new-photos" />
      <span class="hint">The new photos to check against A.</span>
    </label>

    <div class="modal-actions">
      <button type="submit" class="btn btn-primary">Compare</button>
    </div>
  </form>
</section>

<div id="compare-progress" class="merge-progress" hidden>
  <div class="merge-progress-label" id="compare-progress-text">Working…</div>
  <div class="merge-progress-track"><div class="merge-progress-fill" id="compare-progress-fill"></div></div>
</div>

<div id="compare-result"></div>

<script src="/static/compare.js?v=11"></script>
{% endblock %}
